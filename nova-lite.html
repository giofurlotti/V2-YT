<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#050506">
<title>Nova Lite · AI Mentor</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<script src="/api/config"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
<script src="topbar.js" defer></script>
<link rel="stylesheet" href="theme.css">
<!-- ============================================================
 * NOVA LITE — a simple, drop-in AI mentor for ANY dashboard.
 * Single self-contained file. No backend, no build step.
 *
 * HOW IT WORKS (bring-your-own-key):
 *   • The viewer pastes their OWN free OpenRouter API key (stored only in
 *     their browser's localStorage — never sent anywhere but OpenRouter).
 *   • Nova reads whatever the dashboard saved in localStorage for context.
 *   • Calls the OpenRouter API directly from the browser (OpenRouter sets
 *     Access-Control-Allow-Origin: * — direct client-side calls work,
 *     no proxy needed).
 *
 * This is the lightweight version: a flat CSS orb (no 3D), basic chat.
 * The premium build (3D avatar, Spark voice scheduler, secure server
 * proxy, palettes) is the paid Patreon episode.
 * ============================================================ -->
<style>
* { box-sizing: border-box; }
:root {
  --glow: #A78BFA;
  --accent: #A78BFA; --accent-2: #67E8F9;
  --fg: var(--text-primary); --muted: var(--text-tertiary);
  --line: rgba(255,255,255,.1);
}
body { min-height: 100vh; padding: 0; }

.wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 60px; position: relative; z-index: 1; }
.top { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.key-toggle { margin-left: auto; border: 1px solid var(--line); background: rgba(255,255,255,.03); border-radius: 10px; padding: 7px 10px; cursor: pointer; font-size: 15px; line-height: 1; opacity: .55; transition: opacity .15s; }
.key-toggle:hover { opacity: 1; }
.key-toggle.has-key { opacity: 1; border-color: var(--accent); }
.keypanel { display: none; }
.keypanel.open { display: block; }

/* ---- flat CSS orb avatar (lightweight, no Three.js) ---- */
.orb { width: 60px; height: 60px; border-radius: 50%; position: relative; flex-shrink: 0;
  background: radial-gradient(circle at 32% 28%, #f3ecff, var(--accent) 42%, #4c3399 100%);
  box-shadow: 0 0 22px -2px var(--accent), inset 0 -6px 14px rgba(0,0,0,.25);
  animation: orbFloat 4s ease-in-out infinite; }
.orb::before, .orb::after { content: ''; position: absolute; top: 38%; width: 9px; height: 9px; border-radius: 50%;
  background: #1c1030; box-shadow: 0 0 6px rgba(0,0,0,.4); transition: height .15s; }
.orb::before { left: 30%; } .orb::after { right: 30%; }
.orb.think { animation: orbFloat 1.1s ease-in-out infinite, orbPulse 1.1s ease-in-out infinite; }
.orb.happy::before, .orb.happy::after { height: 4px; border-radius: 0 0 9px 9px; }
@keyframes orbFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
@keyframes orbPulse { 0%,100% { box-shadow: 0 0 22px -2px var(--accent) } 50% { box-shadow: 0 0 34px 2px var(--accent) } }

.title h1 { font-family: var(--font-display); font-style: italic; font-size: 26px; font-weight: 600;
  background: linear-gradient(90deg, var(--accent-2), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.title .role { font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }

/* ---- key setup ---- */
.keybar { display: flex; gap: 8px; margin-bottom: 16px; }
.keybar input { flex: 1; background: rgba(255,255,255,.03); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; padding: 11px 13px; font-size: 13px; outline: none; }
.keybar input:focus { border-color: var(--accent); }
.keybar button { border: 0; border-radius: 10px; padding: 0 16px; cursor: pointer; color: #04140d; background: var(--accent); font-weight: 600; font-size: 13px; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 18px; }
.hint a { color: var(--accent-2); }
.hint.saved { color: var(--accent); }

/* ---- chat ---- */
.feed { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.msg { max-width: 90%; }
.msg.user { align-self: flex-end; }
.msg.coach { align-self: flex-start; width: 100%; }
.bubble { border-radius: 14px; padding: 13px 15px; font-size: 14.5px; line-height: 1.55; }
.msg.user .bubble { background: rgba(255,255,255,.05); border: 1px solid var(--line); }
.msg.coach .bubble { background: rgba(255,255,255,.04); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-left: 3px solid var(--accent); }
.tag { display: inline-block; margin-bottom: 9px; font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #04140d; background: var(--accent); padding: 3px 9px; border-radius: 999px; }
.bubble b, .pill { color: var(--accent); font-weight: 700; }
.pill { background: color-mix(in srgb, var(--accent) 18%, transparent); padding: 1px 7px; border-radius: 6px; font-weight: 600; }
.reply-list { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 6px; }
.reply-list li { line-height: 1.45; }
.dots { display: inline-flex; gap: 5px; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .4; animation: d 1.2s ease-in-out infinite; }
.dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
@keyframes d { 0%,100%{opacity:.35;transform:scale(1)} 50%{opacity:1;transform:scale(1.4)} }

.composer { display: flex; gap: 9px; }
.composer input { flex: 1; background: rgba(255,255,255,.03); border: 1px solid var(--line); color: var(--fg); border-radius: 12px; padding: 13px 15px; font-size: 14.5px; outline: none; }
.composer input:focus { border-color: var(--accent); }
.composer button { width: 50px; border: 0; border-radius: 12px; cursor: pointer; color: #04140d; background: var(--accent); font-size: 18px; }
.composer button:active { transform: scale(.94); }
</style>
</head>
<body>
  <div class="starfield"></div>
  <div class="horizon"></div>
  <div class="wrap">
    <div class="top">
      <div class="orb" id="orb"></div>
      <div class="title"><h1>Nova Lite</h1><div class="role">your mentor</div></div>
      <button id="keyToggle" class="key-toggle" aria-label="API key settings" title="API key">🔑</button>
    </div>

    <div class="keypanel" id="keypanel">
      <div class="keybar">
        <input id="keyInput" type="password" placeholder="paste your free OpenRouter API key (sk-or-…)" autocomplete="off" />
        <button id="keySave">Save</button>
      </div>
      <div class="hint" id="hint">
        Your key is stored only in <b>this browser</b> and sent straight to OpenRouter — never to us.
        Get a free one at <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai</a>.
      </div>
    </div>

    <div class="feed" id="feed"></div>

    <div class="composer">
      <input id="chatInput" placeholder="ask Nova anything…" autocomplete="off" />
      <button id="send" aria-label="Send">→</button>
    </div>
  </div>

<script>
(function(){
  const KEY_LS = 'nova_lite_api_key';
  const feed = document.getElementById('feed');
  const input = document.getElementById('chatInput');
  const orb = document.getElementById('orb');
  const keyInput = document.getElementById('keyInput');
  const hint = document.getElementById('hint');
  const keypanel = document.getElementById('keypanel');
  const keyToggle = document.getElementById('keyToggle');
  keyToggle.addEventListener('click', () => keypanel.classList.toggle('open'));

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function setOrb(s){ orb.className = 'orb' + (s ? ' ' + s : ''); }

  // ---- key handling ----
  // Defensive cleanup: an older, now-removed sync path stored these keys via
  // JSON.stringify(), which wraps a plain string in literal quote characters
  // ("sk-ant-..." instead of sk-ant-...). If a key still has that shape from
  // before, strip it and re-save the clean value so it self-heals on read.
  function cleanKeyValue(v, storeKey) {
    if (typeof v !== 'string' || v.length < 2) return v;
    if (v[0] === '"' && v[v.length - 1] === '"') {
      let cleaned;
      try { cleaned = JSON.parse(v); } catch (e) { cleaned = v.slice(1, -1); }
      if (typeof cleaned === 'string' && storeKey) { try { localStorage.setItem(storeKey, cleaned); } catch (e) {} }
      return cleaned;
    }
    return v;
  }
  function savedKey(){ try { return cleanKeyValue(localStorage.getItem(KEY_LS) || '', KEY_LS); } catch(e){ return ''; } }
  function refreshKeyUI(){
    if (savedKey()) {
      hint.classList.add('saved'); hint.innerHTML = '✓ Key saved in this browser. Ask away.';
      keyInput.placeholder = '•••• key saved ••••'; keyToggle.classList.add('has-key');
    } else {
      hint.classList.remove('saved');
      hint.innerHTML = 'Your key is stored only in <b>this browser</b> and sent straight to OpenRouter — never to us. Get a free one at <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai</a>.';
      keyInput.placeholder = 'paste your free OpenRouter API key (sk-or-…)'; keyToggle.classList.remove('has-key');
    }
  }
  refreshKeyUI();
  document.getElementById('keySave').addEventListener('click', () => {
    const k = keyInput.value.trim();
    if (!k) return;
    try { localStorage.setItem(KEY_LS, k); } catch(e){}
    keyInput.value = '';
    refreshKeyUI();
    keypanel.classList.remove('open'); // tuck it away so it's not on screen
    pushApiKeys();
  });

  // ---- API key sync (shared 'apikeys' row with nutrition.html) ----
  // Deliberately ONE-WAY-SAFE, not the generic bidirectional initCloudSync:
  // a key you just typed here must never be silently overwritten by a
  // slightly-late remote pull racing your save — that was a real bug where
  // a freshly-saved key got clobbered by a stale one moments later, making
  // it look "invalid". Pulling only ever fills in a key that's currently
  // EMPTY locally; saving always pushes whatever's present.
  const USDA_KEY_LS = 'usda_fdc_api_key';
  const KS_URL = (window.DASH_SUPABASE_URL) || 'https://srajryooffirbroltjmg.supabase.co';
  const KS_KEY = (window.DASH_SUPABASE_KEY) || 'sb_publishable_5142ZwTLF_DkSVRzciNuRA_bHwRAu4c';
  function usdaSavedKey() { try { return cleanKeyValue(localStorage.getItem(USDA_KEY_LS) || '', USDA_KEY_LS); } catch (e) { return ''; } }
  async function pullApiKeysIfMissing() {
    if (savedKey() && usdaSavedKey()) return;
    try {
      const r = await fetch(KS_URL + '/rest/v1/app_state?select=data&key=eq.apikeys', {
        headers: { apikey: KS_KEY, Authorization: 'Bearer ' + KS_KEY },
      });
      const rows = await r.json();
      const data = rows && rows[0] && rows[0].data;
      if (!data) return;
      let changed = false;
      if (!savedKey() && data.nova_lite_api_key) { localStorage.setItem(KEY_LS, data.nova_lite_api_key); changed = true; }
      if (!usdaSavedKey() && data.usda_fdc_api_key) { localStorage.setItem(USDA_KEY_LS, data.usda_fdc_api_key); }
      if (changed) refreshKeyUI();
    } catch (e) {}
  }
  async function pushApiKeys() {
    const payload = {};
    const nk = savedKey(); if (nk) payload.nova_lite_api_key = nk;
    const uk = usdaSavedKey(); if (uk) payload.usda_fdc_api_key = uk;
    if (!Object.keys(payload).length) return;
    try {
      // Fetch-merge-push so a device that only has one of the two keys
      // locally doesn't wipe the other one out of the shared row.
      let current = {};
      try {
        const r = await fetch(KS_URL + '/rest/v1/app_state?select=data&key=eq.apikeys', {
          headers: { apikey: KS_KEY, Authorization: 'Bearer ' + KS_KEY },
        });
        const rows = await r.json();
        current = (rows && rows[0] && rows[0].data) || {};
      } catch (e) {}
      const merged = Object.assign({}, current, payload);
      await fetch(KS_URL + '/rest/v1/app_state?on_conflict=key', {
        method: 'POST',
        headers: { apikey: KS_KEY, Authorization: 'Bearer ' + KS_KEY, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
        body: JSON.stringify({ key: 'apikeys', data: merged, updated_at: new Date().toISOString() }),
      });
    } catch (e) {}
  }
  pullApiKeysIfMissing();

  // ---- read whatever the dashboard stored (for context) ----
  function dashboardData(){
    const out = {};
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k === KEY_LS) continue; // never send the key as data
      try { out[k] = JSON.parse(localStorage.getItem(k)); } catch(e){ out[k] = localStorage.getItem(k); }
    }
    return out;
  }

  // ---- render: bullets + **pills** ----
  function inlineMarks(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="pill">$1</span>'); }
  function render(text){
    const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const items = [], loose = [];
    for (const l of lines){
      if (/^[-•*]\s+/.test(l)) items.push('<li>' + inlineMarks(l.replace(/^[-•*]\s+/, '')) + '</li>');
      else loose.push(inlineMarks(l));
    }
    let html = loose.join('<br>');
    if (items.length) html += (html ? '<br>' : '') + '<ul class="reply-list">' + items.join('') + '</ul>';
    return html;
  }
  function addUser(t){ const e = document.createElement('div'); e.className = 'msg user'; e.innerHTML = '<div class="bubble">' + esc(t) + '</div>'; feed.appendChild(e); scroll(); }
  function addCoach(html){ const e = document.createElement('div'); e.className = 'msg coach'; e.innerHTML = '<div class="bubble"><span class="tag">Nova</span><div>' + html + '</div></div>'; feed.appendChild(e); scroll(); return e; }
  function scroll(){ window.scrollTo(0, document.body.scrollHeight); }

  /* Free OpenRouter models are each backed by a single upstream host, so any
     one of them can be flaky or briefly reject a request ("Provider returned
     error"). Try a short list in order and fall through to the next on failure. */
  const OPENROUTER_MODELS = ['google/gemma-4-31b-it:free', 'google/gemma-4-26b-a4b-it:free', 'nvidia/nemotron-3-nano-30b-a3b:free'];

  const SYS =
    "You are Nova, a personal mentor living inside the user's life-tracking dashboard. " +
    "You can see their saved data (food, supplements, gym, finance, sleep, goals, etc.). " +
    "Give honest, specific, encouraging guidance. " +
    "Answer in short bullet points starting with '- ', few words each, plain language. " +
    "Wrap key words and numbers in **double asterisks**. " +
    "End with one '- Do today:' bullet giving the single action. " +
    "Dashboard data as JSON:\n";

  let busy = false;
  async function ask(text){
    text = (text||'').trim(); if (!text || busy) return;
    const key = savedKey();
    if (!key){ addCoach('- Paste your **free OpenRouter API key** above first, then ask me again.'); return; }
    busy = true; addUser(text); input.value = '';
    setOrb('think');
    const loading = addCoach('<span class="dots"><i></i><i></i><i></i></span>');
    try {
      let reply = null, lastErrMsg = 'Something went wrong — check your API key.';
      for (const model of OPENROUTER_MODELS) {
        try {
          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: { 'content-type': 'application/json', authorization: 'Bearer ' + key },
            body: JSON.stringify({
              model: model,
              max_tokens: 1024,
              messages: [{ role: 'system', content: SYS + JSON.stringify(dashboardData()) }, { role: 'user', content: text }],
            }),
          });
          const json = await res.json();
          if (json.error) { lastErrMsg = json.error.message || lastErrMsg; continue; }
          const content = json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
          if (!content) { continue; }
          reply = content;
          break;
        } catch (e) { lastErrMsg = 'Could not reach OpenRouter — check your connection and key.'; }
      }
      if (!reply) { loading.querySelector('div:last-child').innerHTML = render('- ' + lastErrMsg); setOrb(''); busy = false; return; }
      loading.querySelector('div:last-child').innerHTML = render(reply);
      setOrb('happy'); setTimeout(() => setOrb(''), 2500);
    } catch(e){
      loading.querySelector('div:last-child').innerHTML = render('- Could not reach OpenRouter — check your connection and key.');
      setOrb('');
    }
    busy = false;
  }

  document.getElementById('send').addEventListener('click', () => ask(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(input.value); });

  addCoach('Hey — I am <b>Nova</b>. Paste your key above, then ask me about food, training, sleep, or where to start. I keep it short and give you <b>one thing to act on</b>.');
})();
</script>
</body>
</html>
